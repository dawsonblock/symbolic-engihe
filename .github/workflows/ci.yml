name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows is experimental: the local vault ACL and SQLite lifecycle
    # tests are POSIX-specific. Linux/macOS POSIX is the supported
    # evaluator platform for this release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
      - name: Verify release inventory
        # The tree must always describe itself: every manifest-covered
        # file is hashed into RELEASE_SHA256.json and checked here. A
        # stale manifest is a failed build, not a "development tree".
        run: |
          python tools/build_release.py --check
          python tools/verify_release.py .
      - name: Run CLI and HTTP integration smoke
        if: runner.os == 'Linux'
        run: python tools/smoke_integration.py

  release:
    # The exact-archive gate. A tag is a release claim, so it verifies
    # the archive it ships rather than the tree it was cut from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: The manifest must match the tagged tree
        run: python tools/build_release.py --check
      - name: The tree must verify against that manifest
        run: python tools/verify_release.py .
      - name: The canonical archive must build and verify
        run: |
          python tools/build_canonical_zip.py /tmp/release.zip \
            --source . --project "SIS_v$(python -c 'import sis; print(sis.__version__)')"
      - name: The evidence bundle must build and verify
        run: |
          python tools/build_evidence_bundle.py
          python tools/build_evidence_bundle.py --verify \
            "release/SIS_v$(python -c 'import sis; print(sis.__version__)')_VALIDATION_EVIDENCE.zip"

  postgres:
    # Qualifies the multi-process profile: the SQLite-only job skips the
    # cross-replica replay tests, so this job is the one that proves the
    # production claim.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sis_test
          POSTGRES_PASSWORD: sis_test
          POSTGRES_DB: sis_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
        env:
          SIS_POSTGRES_DSN: postgresql://sis_test:sis_test@127.0.0.1:5432/sis_control
          # The qualification fixture drops the control-plane tables; the
          # service database above is disposable.
          SIS_POSTGRES_ALLOW_DESTRUCTIVE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
