name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows is experimental: the local vault ACL and SQLite lifecycle
    # tests are POSIX-specific. Linux/macOS POSIX is the supported
    # evaluator platform for this release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
      - name: Verify release inventory
        run: python tools/verify_release.py .
      - name: Run CLI and HTTP integration smoke
        if: runner.os == 'Linux'
        run: python tools/smoke_integration.py
