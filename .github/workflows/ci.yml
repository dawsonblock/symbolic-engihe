name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows is experimental: the local vault ACL and SQLite lifecycle
    # tests are POSIX-specific. Linux/macOS POSIX is the supported
    # evaluator platform for this release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
      - name: Verify release inventory
        run: python tools/verify_release.py .
      - name: Run CLI and HTTP integration smoke
        if: runner.os == 'Linux'
        run: python tools/smoke_integration.py

  postgres:
    # Qualifies the multi-process profile: the SQLite-only job skips the
    # cross-replica replay tests, so this job is the one that proves the
    # production claim.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sis_test
          POSTGRES_PASSWORD: sis_test
          POSTGRES_DB: sis_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
        env:
          SIS_POSTGRES_DSN: postgresql://sis_test:sis_test@127.0.0.1:5432/sis_control
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
