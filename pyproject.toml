[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-induction-engine"
version = "3.3.1"
description = "Model-independent, bounded symbolic rule induction with evidence-gated persistence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Symbolic Induction Project"}]
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver>=4.12,<5"]
dev = ["pytest==8.4.2"]
evaluator = ["pytest==8.4.2"]
training = ["torch>=2.1,<3", "transformers>=4.44,<5", "peft>=0.12,<1", "accelerate>=0.30,<2"]
codex = ["openai-codex==0.163.0"]

[project.scripts]
sis = "sis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
